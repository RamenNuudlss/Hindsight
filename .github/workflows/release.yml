# Builds Hindsight.exe and attaches it to a GitHub release whenever a tag like v1.0.0 is pushed.
name: Release
on:
  push:
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Mono and resource compiler
        run: sudo apt-get update && sudo apt-get install -y mono-devel binutils-mingw-w64-x86-64
      - name: Build
        run: ./build.sh
      - name: Attach Hindsight.exe to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Works whether the release was made on github.com or by pushing a tag.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/Hindsight.exe --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/Hindsight.exe --title "Hindsight $GITHUB_REF_NAME" --generate-notes
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: Hindsight
          path: dist/Hindsight.exe
