# Builds Hindsight.exe and attaches it to a GitHub release whenever a tag like v1.0.0 is pushed.
name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Mono and resource compiler
        run: sudo apt-get update && sudo apt-get install -y mono-devel binutils-mingw-w64-x86-64
      - name: Build
        run: ./build.sh
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/Hindsight.exe --title "Hindsight $GITHUB_REF_NAME" --generate-notes
      - uses: actions/upload-artifact@v4
        with:
          name: Hindsight
          path: dist/Hindsight.exe
